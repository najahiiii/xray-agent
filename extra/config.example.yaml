control:
  base_url: "https://panel.example.com"
  # Optional override; defaults to wss://panel.example.com/agent/ws.
  socket_url: ""
  token: "AGENT_BEARER_TOKEN"
  server_slug: "sg-1"
  tls_insecure: false
  outbox_path: "/var/lib/xray-agent/outbox.db"

xray:
  binary: "/usr/local/bin/xray"
  version: "25.10.15"
  api_server: "127.0.0.1:10085"
  api_timeout_sec: 5
  inbound_tags:
    vless: "vless-ws"
    vmess: "vmess-ws"
    trojan: "trojan-ws"

intervals:
  online_sec: 10
  stats_sec: 60
  heartbeat_sec: 30
  metrics_sec: 30
  core_check_sec: 43200

logging:
  level: "info" # debug|info|warn|error
